# The oracle that pins the Windows port's board arithmetic to the ORIGINAL.
#
# It depends on the repo's own `web/text` crate by path, so it cannot drift from the source it
# claims to speak for: every vector in
# `win/tests/FamilyConnect.Core.Tests/Fixtures/board-vectors.json` is what `fc_text::board`
# actually answered. Regenerate with
#
#     cd win/tools/board-oracle && cargo run --quiet > ../../tests/FamilyConnect.Core.Tests/Fixtures/board-vectors.json
#     cd win/tools/board-oracle && cargo run --quiet -- chat > ../../tests/FamilyConnect.Core.Tests/Fixtures/chat-vectors.json
#
# The second command prints the words a chat ROW is drawn with — a call record's line, what an
# attachment is called when it has no name, and the notification sentences — from the same crate.
#
#     cd win/tools/board-oracle && cargo run --quiet -- media-plan > ../../tests/FamilyConnect.Core.Tests/Fixtures/media-plan-vectors.json
#
# The third prints fc_text::media_plan — what a picked video or sound file becomes before upload
# (issue #74). Three ports are held to it, so copy the SAME file, byte for byte, to
# ios/FamilyConnectTests/Fixtures/ and android/app/src/test/resources/ as well; CI compares all three.
#
#     cd win/tools/board-oracle && cargo run --quiet -- record > ../../tests/FamilyConnect.Core.Tests/Fixtures/record-vectors.json
#
# The fourth prints fc_text::record — the Send slot, the video button, the hold and the round
# video's arithmetic (issue #79). Apple and Android are held to all of it, Windows to everything but
# the hold; copy it to the same two places as the media-plan file, and CI compares all three.
#
# and the C# suite (OracleTests) will fail on anything the port no longer matches. Its own
# workspace on purpose: joining web/'s would put a native binary in the wasm crate's tree.
[package]
name = "board-oracle"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
fc-text = { path = "../../../web/text" }
serde_json = "1"
unicode-segmentation = "1.13"

[workspace]
