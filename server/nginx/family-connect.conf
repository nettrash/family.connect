# family-connect nginx site — TLS termination + reverse proxy.
#
# The server binds plain HTTP on 127.0.0.1:8080; nginx owns the public
# endpoint, terminates TLS, and proxies both REST and the WebSocket upgrade
# under /api/v1/. Replace chat.example.com with your host and point the
# certificate paths at your ACME output.

# Standard WebSocket upgrade dance: forward "Connection: upgrade" only when
# the client actually asked to upgrade, plain "close" otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name chat.example.com;

    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;

    # Slightly above the server's own 16 KiB body limit so the backend — not
    # nginx — produces the JSON-shaped error for oversized payloads.
    client_max_body_size 64k;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket upgrade headers (harmless on plain REST requests).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Must exceed the server's 30 s WebSocket ping interval, otherwise
        # nginx kills idle-but-healthy sockets between pings.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything outside /api/v1/ has no business here.
    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name chat.example.com;
    return 301 https://$host$request_uri;
}
