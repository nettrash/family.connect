# family-connect nginx site — reverse proxy in front of the loopback server.
#
# The server binds plain HTTP on 127.0.0.1:8080; nginx owns the public
# endpoint and proxies both REST and the WebSocket upgrade under /api/v1/.
#
# This file is deliberately HTTP-only. Install it, replace chat.example.com
# with your host, then run:
#
#     sudo certbot --nginx -d chat.example.com
#
# certbot rewrites this server block in place: it adds the TLS listener with
# its certificate paths and an HTTP→HTTPS redirect. Shipping a hand-written
# 443 block instead would break `nginx -t` before the first certificate
# exists, and the standalone `http2` directive would fail on the nginx
# versions Ubuntu LTS ships (it needs nginx 1.25.1+).

# Standard WebSocket upgrade dance: forward "Connection: upgrade" only when
# the client actually asked to upgrade, plain "close" otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Rate limiting --------------------------------------------------------
#
# Both unauthenticated endpoints hash a password with argon2id, and login
# does so EVEN FOR A USERNAME THAT DOES NOT EXIST — deliberately, to keep
# the unknown-user and wrong-password paths indistinguishable by timing.
# That makes them the two most expensive things a stranger can ask this
# server to do, on a box whose address is compiled into a published app.
# The server bounds how many hashes run at once (limits.
# max_password_hashes_in_flight); these bound how many are ASKED FOR, which
# is the half nginx is better placed to do.
#
# Zones are keyed on $binary_remote_addr, so put nginx behind nothing that
# hides the client IP without also setting real_ip_header — otherwise every
# request shares one key and the first person to sign in locks out the rest.
# 10m holds ~160k addresses.
limit_req_zone $binary_remote_addr zone=fc_auth:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=fc_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=fc_conn:10m;

# 429 rather than nginx's default 503: the client is being asked to slow
# down, not told the server is broken, and 503 makes an app retry-storm.
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name chat.example.com;

    # Slightly above the server's own 16 KiB body limit so the backend — not
    # nginx — produces the JSON-shaped error for oversized payloads.
    client_max_body_size 64k;

    # Profile pictures are the one route that carries more than JSON, and
    # the 64k ceiling above would reject every upload. Same reasoning as
    # there: a little over the server's own 256 KiB limit, so the backend
    # answers `avatar_too_large` in the protocol's error shape rather than
    # nginx returning a bare HTML 413.
    # The two argon2 doors. Exact-match `=` locations, which nginx prefers
    # over the `/api/v1/` prefix below — and which inherit NOTHING from it,
    # so proxy_pass and every proxy_set_header have to be repeated here.
    # Leaving them out does not fail `nginx -t`; it silently serves a 404
    # from the default root, which is the failure mode worth stating out
    # loud.
    #
    # 6r/m with burst=3 nodelay: three attempts land immediately, then one
    # every ten seconds. A person who has forgotten their password tries
    # three or four times in a row and notices nothing; somebody working
    # through a word list gets six an hour per address, which makes the
    # attack pointless without ever locking a real account out (there is no
    # account lockout in this protocol, and this is why one is not needed).
    location = /api/v1/auth/login {
        limit_req zone=fc_auth burst=3 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Registration is rarer still — a family member joins once — and it is
    # the endpoint that creates rows, so the same bucket with no burst.
    location = /api/v1/auth/register {
        limit_req zone=fc_auth burst=2 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Photos and videos. The global ceiling above is sized for JSON; without
    # this block every upload is refused by nginx before it reaches the
    # server, with a bare HTML 413 that carries none of the protocol's
    # explanation. Keep it in step with `limits.max_attachment_bytes`.
    #
    # proxy_request_buffering off: nginx streams the body straight through
    # rather than spooling 100 MB to its own disk first, which is what makes
    # upload progress on the client mean anything.
    location = /api/v1/attachments {
        client_max_body_size 105m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Previews are small, but they are still bigger than the global 64k.
    location ~ ^/api/v1/attachments/[0-9]+/preview$ {
        client_max_body_size 4m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Downloads: no buffering either, so a video starts playing rather than
    # waiting for nginx to hold the whole file.
    location ~ ^/api/v1/attachments/[0-9]+$ {
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/me/avatar {
        client_max_body_size 288k;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
        # Generous on purpose: a client opening a chat fires a burst of
        # reads, and a family syncing after a flight fires a much bigger
        # one. This is a runaway guard, not a budget — the auth doors above
        # are where the tight limit belongs.
        #
        # It covers the WebSocket upgrade too, which is one request per
        # connection and not per frame, so a long-lived socket costs the
        # bucket nothing after it is established. limit_conn is what bounds
        # sockets: 24 is several devices per person for a large family,
        # counted per ADDRESS, and a household behind one NAT is one
        # address — hence not a smaller number.
        limit_req zone=fc_api burst=60 nodelay;
        limit_conn fc_conn 24;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket upgrade headers (harmless on plain REST requests).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Must exceed the server's 30 s WebSocket ping interval, otherwise
        # nginx kills idle-but-healthy sockets between pings.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A throttle answered in the PROTOCOL'S OWN SHAPE, with Retry-After.
    #
    # nginx's built-in 429 is an HTML page and carries no Retry-After, so a
    # client got a body it could not parse and no idea how long to wait —
    # and both apps used to record that as a failed message, which is the
    # one thing a throttle must never look like (docs/protocol.md, "Error
    # shape": `too_many_requests` is TRANSIENT). `always` because the
    # header has to survive an error response, and the internal location
    # keeps this off the public URL space.
    error_page 429 = @throttled;
    location @throttled {
        internal;
        default_type application/json;
        add_header Retry-After 2 always;
        return 429 '{"error":{"code":"too_many_requests","message":"too many requests — slow down"}}';
    }

    # Everything outside /api/v1/ has no business here.
    location / {
        return 404;
    }
}
