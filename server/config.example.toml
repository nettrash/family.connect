# family-connect server configuration.
#
# Install location: /etc/family-connect/config.toml
#
# Every key below is optional and shown with its default, so an empty file is
# a valid configuration for local experiments (loopback listener, PostgreSQL
# on localhost as user family_connect). Copy this file, change what you need,
# keep the rest as documentation.

[server]
# Address the HTTP + WebSocket listener binds to. Keep this on loopback in
# production: nginx terminates TLS and proxies /api/v1 (including the
# WebSocket upgrade) to this address — see nginx/family-connect.conf.
bind = "127.0.0.1:8080"
# How a member reaches YOU, the operator — an email address, a URL, a
# sentence. Served to the apps on GET /me and shown on their report screen.
#
# It exists because a family's owner is its moderator, and the owner is
# sometimes the problem: a report naming the owner never reaches them
# (protocol.md, "Reporting a member"), so there has to be somewhere else to
# go. Leave it unset and the apps draw no escalation line at all, which is
# honest for a family server run by somebody in the family — and not honest
# for a server strangers can register on.
# support_contact = "family-admin@example.com"

[families]
# Whether this server takes NEW families at all. Family Connect is one family
# on a server of its own, so a server you run for yours can close its door:
# with this false, POST /families answers family_registration_disabled and
# the apps replace "Create a family" with directions to run one's own server
# (the project's repository, https://github.com/nettrash/family.connect).
# Joining the family already here — and registering an account to do so —
# still works, which is the whole reason the server exists. Leave it true
# on a fresh server, or its first family can never get in.
registration = true

[database]
# PostgreSQL connection parameters. The server opens a pool of at most
# max_connections connections and fails startup if the database is not
# reachable within connect_timeout_secs (fail fast under systemd; Restart=
# on-failure retries every 5 s until PostgreSQL is up).
host = "127.0.0.1"
port = 5432
user = "family_connect"
password = ""
database = "family_connect"
max_connections = 10
connect_timeout_secs = 10

[auth]
# Sessions slide: an authenticated request arriving more than
# session_touch_interval_mins after the previous one pushes the session's
# expiry out to now() + session_ttl_days. The interval batches the renewal
# writes so a chatty client doesn't UPDATE the sessions row on every request.
# 180 days keeps a rarely-used family device logged in without keeping a
# stolen token alive forever.
session_ttl_days = 180
session_touch_interval_mins = 15

[limits]
# Maximum message body length in characters (Unicode scalar values, not
# bytes) — protocol.md fixes the default at 4000.
max_message_chars = 4000
# A poll's options: how many one poll may offer, and how long each may be.
#
# The QUESTION is the message body and is bounded by max_message_chars above
# — a poll adds no second place for prose. These two bound the BUTTONS, which
# is why 100 characters is generous rather than stingy.
#
# The FEWEST options is not a setting: two, always. A poll with one option is
# a statement, not a question, and nothing good comes of an operator being
# able to turn that on. Raising max_poll_options past 10 is safe as far as
# this server is concerned, but the clients lay a poll out as a list of
# tappable rows in a chat bubble — protocol.md fixes the default at 10.
max_poll_options = 10
max_poll_option_chars = 100
# Largest photo or video accepted, in bytes (100 MB). The clients re-encode
# a video past this rather than refusing outright, so raising it mostly
# changes how much of the family's disk a single message can take. Keep the
# nginx `location = /api/v1/attachments` block in step with it.
max_attachment_bytes = 104857600
# Most attachments one message may claim — the album ceiling. Ten is what
# the clients lay out as a grid in one bubble; protocol.md fixes the default
# at 10. The FEWEST is not a setting: one, always — a message with no
# attachment is just an ordinary message. Note the size ceiling above is per
# ATTACHMENT, so one message can in principle carry ten times that.
max_attachments_per_message = 10
# Free space on the attachments filesystem that uploads may not eat into
# (2 GiB). Set 0 to disable.
#
# This is a floor for PostgreSQL, not a budget for photos. The database
# usually shares this filesystem and copes with a full disk far worse than a
# refused upload does, so uploads stop while there is still room and the
# sender is told `storage_full` (507) — a refusal that says the SERVER is
# out of space, not that their picture was too big.
#
# The check runs before the body is read and uses Content-Length when the
# client sent one; the write is capped at max_attachment_bytes regardless,
# so the worst an absent length can do is overshoot this floor by one
# attachment. Raise it if you run anything else on the volume, and see
# `docs/operations.md` for putting attachments on their own filesystem,
# which is the stronger version of this guarantee.
min_free_disk_bytes = 2147483648
# How many password hashes may run at once.
#
# argon2id allocates 19 MiB per hash, and both endpoints that reach it are
# unauthenticated — login hashes even for a username that does not exist, on
# purpose, so that an unknown user and a wrong password cannot be told apart
# by timing. Without this bound the blocking pool's 512 threads can be made
# to ask for ~9.7 GiB, which is a stranger choosing when your server dies.
#
# Eight is ~152 MiB at peak and far more concurrency than a family produces.
# Requests over the bound WAIT rather than being refused; how many are
# allowed to arrive in the first place is nginx's `limit_req` (see
# nginx/family-connect.conf), and the two are meant to be used together.
max_password_hashes_in_flight = 8
# The CEILING on what a family owner may set as their own member cap, and the
# cap that binds at the join door for a family that has set none.
#
# This is YOUR runaway guard, not the number the apps show: an owner sets
# their family's own max_members in the app, and may only set it lower than
# this. Fifty is a generous family — three generations plus in-laws is nearer
# thirty — and the point of the ceiling is that one family cannot decide to
# be ten thousand people on your box.
#
# Lowering it never invalidates a family that is already larger, and existing
# caps are not re-checked against it: a family whose cap was legal when it
# was set stays editable, or one edit here locks owners out of their own
# settings screen.
max_family_members = 50
# Largest preview (the downscaled photo or a video's poster frame). Small on
# purpose: it is drawn in a chat bubble.
max_preview_bytes = 2097152
# How long an UNCLAIMED upload survives before the sweeper deletes it — a
# send the user abandoned must not leave 100 MB behind forever.
attachment_grace_hours = 24
# How long a message is kept before it is deleted, along with any photo,
# video or file it owns. Runs at boot and hourly after, alongside the
# unclaimed-upload sweep.
#
# SET 0 TO KEEP EVERYTHING. "Off" is a state rather than a very large
# number, so nobody has to reason about what 36500 means.
#
# What this deletes: messages and their attachments. Reactions go with
# their message; a newer reply survives and simply loses its quote. The
# family BOARD is not touched — a sticker note is a live thing on a wall,
# not history.
#
# Note that clients keep their own local copy of the history they have
# already downloaded; this frees the SERVER's disk.
retention_days = 100
# GET /chats/{id}/messages page size: the default when the client sends no
# limit, and the ceiling a client-supplied limit is clamped to.
default_page_size = 50
max_page_size = 200
# Maximum accepted HTTP request body. 16 KiB comfortably fits a 4000-char
# multi-byte message plus JSON overhead while bounding memory per request.
max_body_bytes = 16384
# Outbound frames buffered per WebSocket connection. When the buffer is full
# the connection is considered too slow and dropped — the socket is a live
# wire, not a queue; clients resync over REST (protocol.md "best-effort
# delivery").
ws_send_queue = 64
# Protocol-level ping cadence, and the idle cutoff after which a silent
# socket is closed. The idle timeout must exceed the ping interval so a
# healthy client always gets at least one ping (and can answer it) before
# being declared dead. protocol.md fixes the defaults at 30 s / 75 s.
ws_ping_interval_secs = 30
ws_idle_timeout_secs = 75

[push]
# Notification body policy: true puts the message text into the notification
# body, false always sends "New message" instead — for households that
# consider lock screens too public for message content (protocol.md).
include_message_body = true

# Real delivery is enabled per platform by the PRESENCE of its section:
# [push.apns] for iOS devices, [push.fcm] for Android. A platform without a
# section only records its would-be notifications in the server log, so a
# server with no push credentials keeps working exactly as before. (The old
# `driver = "log"` key is deprecated: it is accepted and ignored.)

# [push.apns]
# # Token-based APNs authentication. Create an APNs auth key under Apple
# # Developer → Certificates, Identifiers & Profiles → Keys, and download
# # the AuthKey_<KEYID>.p8 (one-time download — keep it safe).
# team_id = "ABCDE12345"                              # Apple Developer Team ID
# key_id = "FGHIJ67890"                               # the auth key's Key ID
# key_file = "/etc/family-connect/AuthKey_FGHIJ67890.p8"
# The iOS app's bundle identifier (NOT the Android application id — note
# the capitalization), sent as the apns-topic header. A mismatch makes
# APNs reject every push with TopicDisallowed.
# bundle_id = "me.nettrash.FamilyConnect"
# # "production" for App Store / TestFlight builds, "sandbox" for Xcode
# # development builds — device tokens are environment-specific.
# environment = "production"
# # endpoint = "https://api.push.apple.com"           # derived from environment;
#                                                     # override for tests only

# [push.fcm]
# # Firebase service account: Firebase console → Project settings →
# # Service accounts → "Generate new private key" downloads this JSON.
# credentials_file = "/etc/family-connect/firebase-service-account.json"
# # endpoint = "https://fcm.googleapis.com"           # override for tests only

[storage]
# Where photo and video bytes live. On disk, not in PostgreSQL: at 100 MB a
# database row means buffering the whole file in memory on every read and
# write, and a pg_dump that grows without bound.
#
# NOTE FOR BACKUPS: because of that, a database dump is no longer a complete
# backup — this directory has to be backed up alongside it.
#
# The default matches the systemd unit's StateDirectory=family-connect.
attachments_dir = "/var/lib/family-connect/attachments"

# ---------------------------------------------------------------------------
# Voice calls
# ---------------------------------------------------------------------------
# One-to-one, voice-only, PEER-TO-PEER calls between two family members. The
# server only SIGNALS a call — it passes offers, answers and ICE candidates
# between the two devices over the sockets they already hold, wakes a phone
# that has none, and writes one message into the direct chat when the call
# ends. The audio itself goes directly between the two devices and never
# touches this server.
#
# What this section configures is therefore not the calls but the ICE
# servers the clients are handed: STUN so two phones behind ordinary home
# routers can find each other directly, and TURN as the relay of last resort
# for the networks where they cannot.

[calls]
# Turn signalling off entirely. With this false, GET /calls/ice and every
# call_offer answer `calls_disabled`, and GET /me reports calls_enabled:
# false so the apps hide their call button.
enabled = true

# Video calls, meaningful only with calls enabled. A call placed with
# "video": true rings with a camera UI and records as a video call; the
# kind is decided when the call is placed and fixed for its life. With this
# false, such an offer is refused with `video_calls_disabled` and voice
# calls are untouched — a relay sized for voice carries ~10 kB/s per call,
# video two orders of magnitude more, and a Raspberry Pi behind home
# broadband is entitled to say no. GET /me reports it (ANDed with `enabled`)
# as video_calls_enabled so the apps hide the video button alone.
video_enabled = true

# STUN servers, as stun:/stuns: URLs. The default names Google's public
# STUN, because a voice feature that only works inside one Wi-Fi network is
# not a voice feature. A STUN request carries no family data — it only asks
# "what is my public address" — but it does reveal a device's address to
# that server, so an operator who would rather not can point this at their
# own coturn, or empty it.
stun_urls = ["stun:stun.l.google.com:19302"]

# TURN servers, as turn:/turns: URLs. Empty by default: calls that cannot
# connect directly simply fail. A TURN relay carries the ENCRYPTED media (it
# cannot read it) but it does carry it, which is why it is the operator's own
# coturn rather than anything shipped here. Setting these REQUIRES
# credentials below.
# turn_urls = ["turn:turn.example.com:3478?transport=udp", "turns:turn.example.com:5349"]

# The recommended credential scheme: coturn's `static-auth-secret`
# (use-auth-secret). When set, every GET /calls/ice mints a time-limited
# credential for the caller — username "<expiry>:<user_id>", credential
# base64(HMAC-SHA1(secret, username)) — so a leaked credential expires on its
# own. Put the SAME secret in coturn's turnserver.conf.
# turn_secret = "the-same-static-auth-secret-as-coturn"

# The static long-term alternative, used only when turn_secret is empty. A
# single username/password every client shares — simpler, but a leak lasts
# until you rotate it by hand.
# turn_username = "family"
# turn_password = "a-long-random-password"

# How long a minted TURN credential is good for. A day: longer than any call,
# short enough that a leaked one is not a relay forever. Ignored for the
# static username/password.
turn_credential_ttl_secs = 86400

# How long a call rings before the server gives up and marks it missed. The
# apps stop ringing at the same time.
ring_timeout_secs = 45

# ---------------------------------------------------------------------------
# The assistant
# ---------------------------------------------------------------------------
# Each member gets one PRIVATE chat with an assistant. Private is the whole
# point: it belongs to that member alone, no other member can read it, and it
# is never part of the family chat.
#
# What leaves this server is deliberately narrow. A question carries the
# system prompt below plus the last `history_messages` turns of THAT MEMBER'S
# OWN assistant thread — never the family chat, never anyone else's thread.
# Nothing anybody else wrote is ever sent anywhere.
#
# The whole section is OFF unless `enabled` is true AND `endpoint`,
# `deployment` and `api_key` are all set. A half-filled section behaves as
# "off" rather than failing every question at runtime, so it is safe to fill
# in gradually. With it off, the assistant chat is simply never created.

# [ai]
# enabled = true
#
# # The Azure OpenAI resource endpoint. No trailing slash needed.
# #
# # Azure has more than one endpoint shape, and asking the wrong one answers
# # a bare `404 Resource not found` that cannot tell you which part was
# # wrong. If your portal shows a full "target URI" — AI Foundry and
# # serverless deployments do, and their path is NOT
# # /openai/deployments/... — paste the whole thing here instead:
# #
# #     endpoint = "https://YOUR-RESOURCE.services.ai.azure.com/models/chat/completions"
# #
# # An endpoint that already names /chat/completions is used verbatim, and
# # `deployment` below is then ignored.
# #
# # An endpoint ending in /openai/v1 is Azure's newer OpenAI-COMPATIBLE
# # surface. It is handled too, and differs in two ways worth knowing: the
# # deployment goes in the request BODY rather than the path, and there is no
# # api-version query at all.
# #
# #     endpoint = "https://YOUR-RESOURCE.openai.azure.com/openai/v1"
# #
# # And an endpoint that carries a QUERY of its own — `?api-version=preview`
# # and the like — is a finished URL and is sent exactly as pasted. Nothing
# # could be spliced onto one anyway: a query starts at the first `?`, so
# # anything appended lands inside it. This is the shape Azure AI Foundry
# # prints for a model deployment, and it is what the FLUX example further
# # down uses.
# endpoint = "https://YOUR-RESOURCE.openai.azure.com"
#
# # The DEPLOYMENT name — this is what the request URL is built from, and it
# # is NOT necessarily the model name. Azure lets the two differ and they
# # usually do. Getting this wrong gives a 404 from Azure, not a clear error.
# # Ignored when `endpoint` above is already a full completions URL.
# deployment = "YOUR-DEPLOYMENT-NAME"
#
# # The model behind that deployment, RECORDED WITH USAGE so Family
# # Statistics can say what answered. It is not what routes the request —
# # Azure routes on the deployment name, in the path or the body depending
# # on the surface — so the two may differ without breaking anything.
# model = "gpt-oss-120b"
#
# # The key. It belongs HERE, in the server's own config, and never on a
# # client: a key shipped to devices is a key you no longer control.
# #
# # This file is read VERBATIM — there is no ${VAR} expansion — so the file
# # itself is the secret. Keep it out of version control, and readable only
# # by the user the service runs as:
# #     sudo chown family-connect:family-connect /etc/family-connect/config.toml
# #     sudo chmod 600 /etc/family-connect/config.toml
# api_key = "paste-the-azure-key-here"
#
# # WHICH HEADER carries that key. "api-key" (the default, and what Azure
# # OpenAI takes) or "bearer", which sends `Authorization: Bearer <key>` and
# # is what the Foundry model surface takes.
# #
# # Written down rather than guessed from the URL on purpose. A server that
# # silently switched headers on a hostname would answer 401 one day with
# # nothing in the config to explain it; this way "which header carried the
# # key?" is a line you can read.
# #
# # Both sub-sections inherit this and either may override it, which is the
# # ordinary case: a GPT deployment on api-key and a FLUX one on bearer, with
# # ONE key between them.
# auth = "api-key"
#
# # Azure's dated API version. PINNED rather than "latest" on purpose: a
# # silently changing contract is not something a family server should
# # discover in production.
# api_version = "2024-10-21"
#
# # What the assistant is told it is, before the member's own words.
# #
# # ONE prompt, not one per language: the server appends "Answer in
# # <language>." to it per question, and that last line is what decides
# # which language the answer comes back in. So write this in whatever
# # language you like — its job is to say what the assistant is FOR.
# #
# # Which language it names depends on WHERE the question was asked. In a
# # member's private assistant chat it is the asking device's own
# # Accept-Language, because that thread has one reader and it is the person
# # holding the device. In the FAMILY chat the family's own language wins
# # when the owner has set one (PATCH /families/mine), falling back to the
# # asking device when they have not: the answer appears in front of
# # everyone, so it should be in the language the family reads rather than
# # the one whoever typed happens to have their phone in.
# #
# # With neither, the appended line tells it to answer in the language of
# # the message it was sent — which is what it would have done anyway, said
# # out loud so the English above it does not win by default.
# system_prompt = """
# You are a helpful assistant in a family's private chat app. Answer briefly
# and plainly. You can only see this one conversation.
# """
#
# # Longest reply, in tokens. A cap the SERVER owns rather than the model, so
# # one long answer cannot run up a bill.
# max_tokens = 1024
#
# # How many earlier turns of that member's own thread go with a question.
# # Larger means better continuity and a bigger request; nothing outside that
# # one thread is ever included whatever this is set to.
# history_messages = 20
#
# # What the chat is called in the list — and what the family calls the
# # assistant everywhere else: it is the name sent as `assistant.display_name`
# # on GET /families/mine, and the name the assistant's own past replies are
# # attributed to in the transcript an @ai mention carries. Change it and the
# # assistant is called that in front of the family and to itself.
# title = "Assistant"
#
#
# # ---------------------------------------------------------------------------
# # Pictures (docs/protocol.md, "Pictures")
# #
# # The section above is the TEXT deployment and keeps its meaning exactly: a
# # server that configures nothing below behaves as it always did. The two
# # sections here add the other two things no single deployment does — looking
# # at a photograph, and making one — and each is OFF until you name a
# # deployment for it.
# #
# # Everything they do not say is inherited from [ai]: the endpoint, the key
# # and the api-version. In practice all three are deployments on one
# # resource, and pasting a key three times is two chances to paste it wrong.
# #
# # Clients are told what this server can do — `assistant.vision` and
# # `assistant.images` on GET /families/mine — and offer nothing they were not
# # told about.
# # ---------------------------------------------------------------------------
#
# # The deployment that can SEE. A member may then attach a photograph to a
# # question in their OWN assistant chat — or, in the family chat, attach one
# # to an @ai message or reply to one with @ai (#56).
# #
# # NAMING IT IS NOT ENOUGH, and that is deliberate. Each family's owner must
# # also turn `ai_vision` on (PATCH /families/mine), and it is OFF by default
# # for every family — including families that already exist. A photograph is
# # not more of the same thing a model was already being told: it is the faces
# # of people who are not in the conversation, the inside of a home, a child, a
# # document on a table, and it cannot be recalled once it has left. The member
# # attaching one to the question they are asking is the third lock, and it is
# # per picture and per send.
# #
# # What leaves with such a question, and the whole of it: up to FOUR photos
# # off that ONE message — in the family chat, off the @ai message and the
# # message it replies to together — each as the downscaled preview when the
# # client uploaded one, each at most 5 MiB, JPEG or PNG. Never a photo from
# # an earlier message, never one the member did not point the assistant at,
# # never a video, a file or a location. A photo elsewhere in the family chat
# # is a "[photo]" placeholder to the assistant, at any setting — unless the
# # owner has ALSO turned `ai_history_photos` on: a THIRD switch, off by
# # default and openable only while `ai_vision` is on, under which a mention
# # is shown the transcript's newest photos too, filling whatever the mention
# # and its quote left of the same four, each numbered "[photo N]" on its
# # line so the assistant knows whose it is. Nearly every mention in a chat
# # full of photos then becomes a four-image vision call, which is why that
# # one stays off until an owner chooses it (docs/protocol.md, "Recent
# # photos from the family chat").
# [ai.vision]
# deployment = "YOUR-VISION-DEPLOYMENT"
# model = "gpt-4o"
# # endpoint / api_key / api_version may be given here too, when this model
# # answers somewhere else entirely. Omitted, they come from [ai] above.
#
# # The deployment that MAKES a picture, reached by writing `/draw something`
# # at the start of a message (or `@ai /draw something` in the family chat).
# #
# # No family switch, and that asymmetry is the point: what leaves the server
# # on a picture request is the words after `/draw` and NOTHING else — not the
# # thread, not the transcript, not the system prompt, not even the language
# # line. That is a smaller disclosure than an ordinary text question, which
# # carries the last turns of a conversation.
# #
# # Naming this deployment ALSO lets the assistant draw without being told to
# # (#56): every ordinary question then declares one tool, `draw_picture`, to
# # the text model, and when the model calls it the server sends the tool's
# # prompt — one bounded string, and nothing else — here. The question itself
# # still goes to [ai], where it always went. `contextual` — INSIDE this
# # section, below — is the way out for a text deployment that answers 400
# # to a request with a `tools` key.
# #
# # THE BLOCK BELOW IS THE OPENAI-STYLE ONE — an image deployment on your
# # Azure OpenAI resource, taking the same body the OpenAI images API takes.
# # FLUX on Azure AI Foundry is a different shape in four ways and has its own
# # worked example a little further down; if that is what you deployed, read
# # that one instead of adapting this one.
# [ai.images]
# deployment = "YOUR-IMAGE-DEPLOYMENT"
# model = "gpt-image-1"
#
# # Whether the TEXT model may ask for a picture itself (#56). On by default
# # once this section names a deployment; set it to false if your TEXT
# # deployment answers 400 to a request with a `tools` key — the tool is
# # then never declared, and `/draw` keeps working regardless. It is a key
# # of THIS table: under [ai.vision] it would name nothing, and the server
# # refuses to start on a key it does not know under any [ai] table rather
# # than let an opt-out go quietly unread.
# contextual = true
#
# # An images endpoint is the one contract this server cannot verify for you,
# # so every field that varies between image models is yours to set and is
# # OMITTED from the request when you leave it empty. That omission is the
# # whole trick: it is what lets one section speak to a model that requires a
# # field another model refuses.
# #
# # If your portal shows a full target URI for this deployment, paste it as
# # `endpoint` here and it is used verbatim, exactly as [ai] does for chat:
# #
# #     endpoint = "https://YOUR-RESOURCE.services.ai.azure.com/openai/deployments/YOUR-IMAGE-DEPLOYMENT/images/generations?api-version=2025-04-01-preview"
# #
# # `size` goes in the body as-is; empty omits it and lets the deployment
# # choose.
# size = "1024x1024"
# # `width` and `height` are the OTHER spelling of the same thing, as two
# # integers, for the models that take it apart and know nothing of `size`.
# # 0 — the default — omits them. Set these OR `size`, never both: a model
# # that reads one answers 400 to the other.
# width = 0
# height = 0
# # `response_format` is "b64_json" (bytes inline) or "url" (a link the SERVER
# # then fetches — never a client). Empty by default and omitted, because some
# # deployments answer 400 to a field they do not implement; both answers are
# # parsed whichever way they arrive.
# response_format = ""
# # The most bytes one generated picture may be, as a guard against a runaway
# # response. It bounds the download too, when a deployment answers with a URL.
# max_bytes = 16777216
# # `auth` and `api_key` may be given here too, as under [ai.vision]. The FLUX
# # example below needs the first and not the second.
#
# # ---------------------------------------------------------------------------
# # Black Forest Labs FLUX on Azure AI Foundry
# #
# # A worked, working [ai.images] — replace the block above with this one when
# # your picture model is FLUX. It is copied from the sample the Foundry
# # portal prints for the deployment, which is the only description of this
# # surface that has proved to be true:
# #
# #     [ai.images]
# #     endpoint = "https://YOUR-RESOURCE.services.ai.azure.com/providers/blackforestlabs/v1/flux-2-pro?api-version=preview"
# #     deployment = "YOUR-FLUX-DEPLOYMENT"      # e.g. "nettrash-FLUX.2-pro"
# #     model = "FLUX.2-pro"                     # recorded with usage, not sent
# #     auth = "bearer"
# #     size = ""                                # FLUX has no `size`
# #     width = 1024
# #     height = 1024
# #
# # FOUR THINGS DIFFER FROM THE BLOCK ABOVE, and each has its own error when
# # it is the one you got wrong:
# #
# # 1. THE HOST AND PATH. FLUX answers on services.ai.azure.com, under
# #    /providers/blackforestlabs/, and the model IS the path — there is no
# #    /openai/deployments/... and no images/generations segment. Paste the
# #    portal's whole target URI, `?api-version=preview` included; a URL that
# #    carries its own query is sent exactly as written.
# #    Point the OpenAI images path at FLUX instead and it answers
# #    "Model not supported with Responses API" — on every URL shape that was
# #    tried, which is the error that says "right key, right model, wrong
# #    surface". A bare `404 Resource not found` is the other half of the same
# #    mistake: the right surface on the wrong host.
# #
# # 2. THE HEADER. `auth = "bearer"` — FLUX reads the key from
# #    `Authorization: Bearer`, not from `api-key`. A 401 with a key you know
# #    is good means this line, not the key.
# #
# # 3. THE SIZE. Two integers, `width` and `height`; `size = ""` so the string
# #    is not sent at all. A 400 naming a field is this: `size` sent to FLUX,
# #    or width/height sent to a model that wanted `size`.
# #
# # 4. NOTHING ELSE. `model` is still the DEPLOYMENT name on the wire (the
# #    config's `model` is only what statistics record), `n` is always 1, and
# #    the answer comes back as data[0].b64_json synchronously — no polling,
# #    nothing to configure.
# #
# # ONE KEY COVERS BOTH — verified against the live resource. The GPT
# # deployments on YOUR-RESOURCE.openai.azure.com and the FLUX deployment on
# # YOUR-RESOURCE.services.ai.azure.com take the same key, so [ai.images] here
# # needs no `api_key` of its own; it inherits [ai]'s and changes only the
# # header it goes in.
# # ---------------------------------------------------------------------------
