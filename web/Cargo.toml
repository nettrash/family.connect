[package]
name = "family-connect-web"
version = "1.0.0"
edition = "2021"
authors = ["nettrash"]
description = "Family Connect in a browser — the web client (docs/protocol.md)."
license = "MIT"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-net = { version = "0.5", features = ["http", "websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "js"] }
wasm-logger = "0.2"
log = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Storage",
    "Location",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlElement",
    "Element",
    "ScrollToOptions",
    "ScrollBehavior",
    "Performance",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
