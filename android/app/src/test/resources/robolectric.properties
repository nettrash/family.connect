# Robolectric 4.17 supports SDK 37 (the app's targetSdk), but the Compose UI
# tests cannot run there yet: Compose's test rule idles through Espresso, and
# Espresso up to 3.7.0 (Compose's ui-test pulls 3.5.0) reflects on the hidden
# InputManager.getInstance(), which Android 17 removed — every Compose test
# fails with NoSuchMethodException at its first idle. Pinned to 36, the
# newest SDK both run on. Drop this once a stable Espresso without that
# reflection (3.8.0 — its alphas already have none) is on the test classpath.
# (Robolectric <= 4.15.1, the version before, stopped at 35.)
sdk=36
