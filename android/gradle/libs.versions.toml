# Version catalog — Family Connect (Android)
#
# Versions are kept in lockstep with Scan.Android's catalog wherever the
# same library appears, so the two apps build against identical toolchains
# on this machine (one AGP, one Kotlin, one Compose BOM in the cache).
#
# Dependency posture is deliberately minimal: AndroidX + Hilt + Room +
# OkHttp + kotlinx-serialization and nothing else. No Retrofit/Ktor (OkHttp
# alone covers REST + WebSocket — author-sanctioned house convention), no
# Coil (profile pictures are the only remote images, one small square each,
# fetched and cached by AvatarRepository in a few dozen lines), no Paging3
# (a chat needs one cursor query, not a paging framework).
#
# exifinterface is the one concession: minSdk 26 predates ImageDecoder, and
# BitmapFactory ignores EXIF orientation, so without it a photo taken in
# portrait uploads sideways on Android 8.

[versions]
agp = "9.3.1"
kotlin = "2.3.20"
coreKtx = "1.18.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
composeBom = "2026.03.01"
roomRuntime = "2.8.4"
ksp = "2.3.6"
hilt = "2.59.2"
hiltNavigationCompose = "1.3.0"
navigationCompose = "2.9.7"
kotlinxSerialization = "1.11.0"
okhttp = "5.3.2"
datastore = "1.2.1"
exifinterface = "1.4.1"
firebaseBom = "34.18.0"
googleServices = "4.5.0"
junit = "4.13.2"
robolectric = "4.15.1"
truth = "1.4.4"
coroutinesTest = "1.10.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
# ProcessLifecycleOwner — drives the connect-on-foreground / close-on-background
# WebSocket policy in ChatSocketManager.
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "roomRuntime" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "roomRuntime" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "roomRuntime" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "hiltNavigationCompose" }

# Serialization & Network — OkHttp serves both REST and the WebSocket;
# see docs/protocol.md. kotlinx-serialization handles every JSON shape.
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# DataStore — small preference state (server URL, family status, profile).
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# EXIF orientation for uploaded profile pictures — see the header note.
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }

# Firebase — messaging ONLY. Push is the sole Google service this app
# uses; no analytics, no crashlytics, no firebase-core: the privacy
# posture (docs/protocol.md — the server is the family's own box) means
# nothing else may phone Google. The BoM pins the transitive graph so
# firebase-messaging needs no version of its own.
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Declared `apply false` at the root; :app applies it CONDITIONALLY —
# only when a user-supplied google-services.json is present. See the
# "Firebase / google-services" block in app/build.gradle.kts.
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
