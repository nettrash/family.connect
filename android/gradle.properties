org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
# The Kotlin compile daemon's own heap. At the 2 GB it inherited, compiling the
# release variants after the debug ones in one run failed with "Not enough
# memory to run compilation" (2026-10-17).
kotlin.daemon.jvmargs=-Xmx4096m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.builtInKotlin=true
android.newDsl=true
android.dependency.useConstraints=false
